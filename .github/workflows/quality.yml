name: Quality gate

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Static analysis
        run: npm run lint

      - name: Type safety
        run: npm run typecheck

      - name: Web unit tests
        run: npm test

      - name: Function unit tests
        run: npm test --prefix functions

      - name: Security Rules tests
        run: npm run test:rules

      - name: Runtime dependency audit and exact deploy-tool exception
        run: npm run audit:policy

      - name: Production build and prerender
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
